name: Build and Export ARM64 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Pull BuildKit image
        run: docker pull moby/buildkit:buildx-stable-1
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 -t danmu-api:latest --load .
      - name: Save image to tar
        run: docker save -o danmu-api-arm64.tar danmu-api:latest
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmu-api-arm64
          path: danmu-api-arm64.tar
          retention-days: 7
